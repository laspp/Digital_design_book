name: Publish book to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Quarto (with TinyTeX for the PDF build)
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Install fonts and SVG-to-PDF conversion tool used by the PDF build
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation librsvg2-bin

      - name: Render book (HTML + PDF)
        run: quarto render

      - name: Publish to gh-pages branch
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
