<svg width="560" height="260" viewBox="0 0 560 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="560" height="260" fill="#ffffff"/>

  <!-- input wires -->
  <line x1="20" y1="70" x2="110" y2="70" stroke="#374151" stroke-width="1.8"/>
  <text x="24" y="62" font-size="14" fill="#1f2937">in1</text>
  <line x1="20" y1="120" x2="110" y2="120" stroke="#374151" stroke-width="1.8"/>
  <text x="24" y="112" font-size="14" fill="#1f2937">in2</text>

  <!-- LUT2 box -->
  <rect x="110" y="45" width="120" height="100" rx="6" fill="#EAF1F6" stroke="#1A5276" stroke-width="2"/>
  <text x="170" y="100" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2937">LUT2</text>

  <!-- LUT output splits: combinational path (top) and FF path (bottom) -->
  <line x1="230" y1="70" x2="330" y2="70" stroke="#374151" stroke-width="1.8"/>
  <line x1="230" y1="70" x2="230" y2="120" stroke="#374151" stroke-width="1.8"/>
  <line x1="230" y1="120" x2="270" y2="120" stroke="#374151" stroke-width="1.8"/>

  <!-- FF box -->
  <rect x="270" y="95" width="60" height="50" rx="4" fill="#EAF1F6" stroke="#1A5276" stroke-width="2"/>
  <text x="284" y="126" font-size="16" fill="#1f2937">D</text>
  <text x="308" y="126" font-size="16" fill="#1f2937">Q</text>
  <line x1="330" y1="120" x2="360" y2="120" stroke="#374151" stroke-width="1.8"/>

  <!-- clock into FF -->
  <line x1="285" y1="145" x2="285" y2="175" stroke="#374151" stroke-width="1.8"/>
  <line x1="20" y1="175" x2="285" y2="175" stroke="#374151" stroke-width="1.8"/>
  <path d="M 279 145 L 285 155 L 291 145" fill="none" stroke="#1A5276" stroke-width="1.8"/>
  <text x="24" y="192" font-size="14" fill="#1f2937">clk</text>

  <!-- 2:1 output mux -->
  <polygon points="360,60 400,75 400,165 360,180" fill="#EAF1F6" stroke="#1A5276" stroke-width="2"/>
  <line x1="330" y1="70" x2="360" y2="70" stroke="#374151" stroke-width="1.8"/>
  <line x1="360" y1="120" x2="360" y2="120" stroke="#374151" stroke-width="1.8"/>

  <!-- output -->
  <line x1="400" y1="120" x2="470" y2="120" stroke="#374151" stroke-width="1.8"/>
  <text x="476" y="126" font-size="14" fill="#1f2937">out</text>

  <!-- select line from config memory -->
  <line x1="380" y1="180" x2="380" y2="220" stroke="#C0392B" stroke-width="1.8"/>
  <rect x="320" y="220" width="120" height="30" rx="4" fill="#FCEEEA" stroke="#C0392B" stroke-width="1.6"/>
  <text x="380" y="240" text-anchor="middle" font-size="12.5" fill="#7a2a1c">config memory (SRAM)</text>

  <text x="170" y="30" text-anchor="middle" font-size="13" fill="#5f6b7a">one CLB slice</text>
</svg>
