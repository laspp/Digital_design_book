<svg width="640" height="300" viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="300" fill="#ffffff"/>

  <!-- Left CLB -->
  <rect x="20" y="30" width="120" height="70" rx="6" fill="#EAF1F6" stroke="#1A5276" stroke-width="2"/>
  <text x="80" y="70" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">CLB</text>

  <!-- Right CLB -->
  <rect x="500" y="30" width="120" height="70" rx="6" fill="#EAF1F6" stroke="#1A5276" stroke-width="2"/>
  <text x="560" y="70" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">CLB</text>

  <!-- switch box -->
  <rect x="230" y="15" width="180" height="100" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="320" y="10" text-anchor="middle" font-size="12.5" fill="#5f6b7a">switch box</text>

  <!-- horizontal tracks through switch box -->
  <line x1="140" y1="40" x2="500" y2="40" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="140" y1="65" x2="500" y2="65" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="140" y1="90" x2="500" y2="90" stroke="#6b7280" stroke-width="1.5"/>
  <!-- vertical tracks inside switch box -->
  <line x1="270" y1="15" x2="270" y2="115" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="320" y1="15" x2="320" y2="115" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="370" y1="15" x2="370" y2="115" stroke="#6b7280" stroke-width="1.5"/>

  <!-- PIPs at crossings -->
  <circle cx="270" cy="40" r="4" fill="#C0392B"/>
  <circle cx="320" cy="40" r="4" fill="#C0392B"/>
  <circle cx="370" cy="40" r="4" fill="#C0392B"/>
  <circle cx="270" cy="65" r="4" fill="#C0392B"/>
  <circle cx="320" cy="65" r="4" fill="#C0392B"/>
  <circle cx="370" cy="65" r="4" fill="#C0392B"/>
  <circle cx="270" cy="90" r="4" fill="#C0392B"/>
  <circle cx="320" cy="90" r="4" fill="#C0392B"/>
  <circle cx="370" cy="90" r="4" fill="#C0392B"/>

  <!-- callout from one PIP to detail below -->
  <line x1="320" y1="65" x2="320" y2="150" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="326" y="148" font-size="12.5" fill="#7a2a1c">one PIP, magnified</text>

  <!-- NMOS pass-transistor detail -->
  <g transform="translate(120,165)">
    <text x="70" y="-8" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">PIP = one NMOS pass transistor</text>

    <line x1="0" y1="40" x2="45" y2="40" stroke="#374151" stroke-width="1.8"/>
    <text x="-14" y="45" font-size="14" fill="#1f2937">A</text>

    <line x1="95" y1="40" x2="140" y2="40" stroke="#374151" stroke-width="1.8"/>
    <text x="146" y="45" font-size="14" fill="#1f2937">B</text>

    <circle cx="70" cy="40" r="26" fill="#EAF1F6" stroke="#1A5276" stroke-width="2"/>
    <path d="M 45 30 L 45 50 M 45 30 L 60 30 M 45 40 L 60 40 M 45 50 L 60 50 M 60 25 L 60 55 M 60 40 L 95 40" fill="none" stroke="#1A5276" stroke-width="1.8"/>

    <line x1="70" y1="66" x2="70" y2="95" stroke="#C0392B" stroke-width="1.8"/>
    <rect x="45" y="95" width="50" height="26" rx="4" fill="#FCEEEA" stroke="#C0392B" stroke-width="1.6"/>
    <text x="70" y="113" text-anchor="middle" font-size="13" fill="#7a2a1c">M</text>
    <text x="102" y="113" font-size="12.5" fill="#5f6b7a">config bit</text>
  </g>

  <!-- M=0 / M=1 behavior -->
  <g transform="translate(400,175)">
    <text x="0" y="-14" font-size="13.5" font-weight="600" fill="#1f2937">M acts as a switch between A and B:</text>

    <line x1="0" y1="20" x2="40" y2="20" stroke="#374151" stroke-width="1.8"/>
    <text x="-14" y="25" font-size="13" fill="#1f2937">A</text>
    <line x1="65" y1="20" x2="105" y2="20" stroke="#374151" stroke-width="1.8"/>
    <text x="111" y="25" font-size="13" fill="#1f2937">B</text>
    <text x="135" y="25" font-size="13" fill="#5f6b7a">M = 0 (open)</text>

    <line x1="0" y1="60" x2="105" y2="60" stroke="#374151" stroke-width="1.8"/>
    <text x="-14" y="65" font-size="13" fill="#1f2937">A</text>
    <text x="111" y="65" font-size="13" fill="#1f2937">B</text>
    <text x="135" y="65" font-size="13" fill="#5f6b7a">M = 1 (closed)</text>
  </g>
</svg>
