  <text x="610" y="521" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">FF only</text>
  <text x="610" y="538" text-anchor="middle" font-size="11" fill="#1f2937">(C2)</text>
  <line x1="660" y1="525" x2="660" y2="568" stroke="#374151" stroke-width="1.6"/>
  <line x1="660" y1="568" x2="750" y2="568" stroke="#374151" stroke-width="1.6"/>
  <text x="756" y="572" font-size="11.5" fill="#1f2937">CQ2 (bypass-reg.)</text>

  <!-- Row D -->
  <line x1="10" y1="685" x2="40" y2="685" stroke="#374151" stroke-width="1.6"/>
  <text x="14" y="677" font-size="12" fill="#1f2937">6</text>
  <rect x="40" y="640" width="110" height="90" rx="6" fill="#EAF1F6" stroke="#1A5276" stroke-width="2"/>
  <text x="95" y="689" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">LUT6 D</text>
  <line x1="150" y1="685" x2="180" y2="685" stroke="#374151" stroke-width="1.6"/>
  <line x1="230" y1="685" x2="430" y2="685" stroke="#374151" stroke-width="1.6"/>
  <circle cx="245" cy="685" r="3" fill="#374151"/>
