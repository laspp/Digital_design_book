  <line x1="270" y1="322" x2="750" y2="322" stroke="#374151" stroke-width="1.6"/>
  <text x="756" y="326" font-size="11.5" fill="#1f2937">B (combinational)</text>
  <rect x="430" y="330" width="100" height="70" rx="6" fill="#EAF1F6" stroke="#1A5276" stroke-width="2"/>
  <text x="480" y="361" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">FF/Latch</text>
  <text x="480" y="378" text-anchor="middle" font-size="11" fill="#1f2937">(BFF)</text>
  <line x1="530" y1="365" x2="750" y2="365" stroke="#374151" stroke-width="1.6"/>
  <text x="756" y="369" font-size="11.5" fill="#1f2937">BQ (registered)</text>
  <text x="610" y="310" text-anchor="middle" font-size="11" fill="#5f6b7a">direct input (bypass)</text>
  <line x1="610" y1="315" x2="610" y2="328" stroke="#374151" stroke-width="1.6"/>
  <path d="M 604 320 L 610 330 L 616 320" fill="none" stroke="#374151" stroke-width="1.6"/>
  <rect x="560" y="330" width="100" height="70" rx="6" fill="#EAF1F6" stroke="#1A5276" stroke-width="2"/>
  <text x="610" y="361" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">FF only</text>
  <text x="610" y="378" text-anchor="middle" font-size="11" fill="#1f2937">(B2)</text>
  <line x1="660" y1="365" x2="660" y2="408" stroke="#374151" stroke-width="1.6"/>
  <line x1="660" y1="408" x2="750" y2="408" stroke="#374151" stroke-width="1.6"/>
  <text x="756" y="412" font-size="11.5" fill="#1f2937">BQ2 (bypass-reg.)</text>

  <!-- Row C -->
  <line x1="10" y1="525" x2="40" y2="525" stroke="#374151" stroke-width="1.6"/>
  <text x="14" y="517" font-size="12" fill="#1f2937">6</text>
  <rect x="40" y="480" width="110" height="90" rx="6" fill="#EAF1F6" stroke="#1A5276" stroke-width="2"/>
  <text x="95" y="529" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">LUT6 C</text>
  <line x1="150" y1="525" x2="180" y2="525" stroke="#374151" stroke-width="1.6"/>
