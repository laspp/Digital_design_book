  <line x1="270" y1="642" x2="750" y2="642" stroke="#374151" stroke-width="1.6"/>
  <text x="756" y="646" font-size="11.5" fill="#1f2937">D (combinational)</text>
  <rect x="430" y="650" width="100" height="70" rx="6" fill="#EAF1F6" stroke="#1A5276" stroke-width="2"/>
  <text x="480" y="681" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">FF/Latch</text>
  <text x="480" y="698" text-anchor="middle" font-size="11" fill="#1f2937">(DFF)</text>
  <line x1="530" y1="685" x2="750" y2="685" stroke="#374151" stroke-width="1.6"/>
  <text x="756" y="689" font-size="11.5" fill="#1f2937">DQ (registered)</text>
  <text x="610" y="630" text-anchor="middle" font-size="11" fill="#5f6b7a">direct input (bypass)</text>
  <line x1="610" y1="635" x2="610" y2="648" stroke="#374151" stroke-width="1.6"/>
  <path d="M 604 640 L 610 650 L 616 640" fill="none" stroke="#374151" stroke-width="1.6"/>
  <rect x="560" y="650" width="100" height="70" rx="6" fill="#EAF1F6" stroke="#1A5276" stroke-width="2"/>
  <text x="610" y="681" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">FF only</text>
  <text x="610" y="698" text-anchor="middle" font-size="11" fill="#1f2937">(D2)</text>
  <line x1="660" y1="685" x2="660" y2="728" stroke="#374151" stroke-width="1.6"/>
  <line x1="660" y1="728" x2="750" y2="728" stroke="#374151" stroke-width="1.6"/>
  <text x="756" y="732" font-size="11.5" fill="#1f2937">DQ2 (bypass-reg.)</text>

  <!-- Shared clock / clock-enable bus -->
  <text x="400" y="800" text-anchor="middle" font-size="12" fill="#5f6b7a">CLK (common to all 8 flip-flops)</text>
  <line x1="40" y1="806" x2="660" y2="806" stroke="#374151" stroke-width="1.6"/>
  <text x="400" y="824" text-anchor="middle" font-size="12" fill="#5f6b7a">CE (common to all 8 flip-flops)</text>
  <line x1="40" y1="830" x2="660" y2="830" stroke="#374151" stroke-width="1.6"/>
  <line x1="480" y1="835" x2="480" y2="745" stroke="#374151" stroke-width="1.6"/>
  <path d="M 474 753 L 480 743 L 486 753" fill="none" stroke="#374151" stroke-width="1.6"/>
  <line x1="610" y1="835" x2="610" y2="745" stroke="#374151" stroke-width="1.6"/>
  <path d="M 604 753 L 610 743 L 616 753" fill="none" stroke="#374151" stroke-width="1.6"/>

  <!-- INIT / SR callout -->
  <line x1="530" y1="700" x2="560" y2="855" stroke="#C0392B" stroke-width="1.4" stroke-dasharray="5 3"/>
  <rect x="150" y="855" width="700" height="50" rx="6" fill="#FCEEEA" stroke="#C0392B" stroke-width="1.6"/>
  <text x="500" y="885" text-anchor="middle" font-size="12.5" fill="#7a2a1c">each of the 8 flip-flops also has its own INIT (init value) + SR (set/reset) config bits</text>
