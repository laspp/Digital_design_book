  <text x="480" y="521" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">FF/Latch</text>
  <text x="480" y="538" text-anchor="middle" font-size="11" fill="#1f2937">(CFF)</text>
  <line x1="530" y1="525" x2="750" y2="525" stroke="#374151" stroke-width="1.6"/>
