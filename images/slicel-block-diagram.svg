<svg width="1000" height="940" viewBox="0 0 1000 940" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="940" fill="#ffffff"/>

  <text x="500" y="20" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">SLICEL — simplified block diagram (not to scale)</text>

  <!-- Carry chain bar -->
  <rect x="180" y="160" width="50" height="570" rx="6" fill="#EAF1F6" stroke="#1A5276" stroke-width="2"/>
  <text x="205" y="445" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937" transform="rotate(-90 205 445)">Carry chain</text>
  <line x1="205" y1="160" x2="205" y2="138" stroke="#374151" stroke-width="1.6"/>
  <path d="M 199 146 L 205 136 L 211 146" fill="none" stroke="#374151" stroke-width="1.6"/>
  <text x="205" y="128" text-anchor="middle" font-size="11.5" fill="#5f6b7a">COUT → (to slice above)</text>
  <line x1="205" y1="730" x2="205" y2="752" stroke="#374151" stroke-width="1.6"/>
  <path d="M 199 746 L 205 756 L 211 746" fill="none" stroke="#374151" stroke-width="1.6"/>
  <text x="205" y="770" text-anchor="middle" font-size="11.5" fill="#5f6b7a">CIN ← (from slice below)</text>

  <!-- Mux column: F7AMUX / F8MUX / F7BMUX, vertically aligned, right after the carry chain -->
  <rect x="250" y="260" width="150" height="50" rx="6" fill="#EAF1F6" stroke="#1A5276" stroke-width="2"/>
  <text x="325" y="280" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">F7AMUX</text>
  <text x="325" y="297" text-anchor="middle" font-size="10.5" fill="#1f2937">LUT A + LUT B → O7A</text>
  <line x1="325" y1="310" x2="325" y2="420" stroke="#374151" stroke-width="1.6"/>

  <rect x="250" y="420" width="150" height="50" rx="6" fill="#EAF1F6" stroke="#1A5276" stroke-width="2"/>
  <text x="325" y="440" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">F8MUX</text>
  <text x="325" y="457" text-anchor="middle" font-size="10.5" fill="#1f2937">O7A + O7B → O8</text>
  <line x1="400" y1="445" x2="750" y2="445" stroke="#374151" stroke-width="1.6"/>
  <text x="660" y="441" font-size="11.5" fill="#5f6b7a">O8 → wide-function output (to routing)</text>

  <rect x="250" y="580" width="150" height="50" rx="6" fill="#EAF1F6" stroke="#1A5276" stroke-width="2"/>
  <text x="325" y="600" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">F7BMUX</text>
  <text x="325" y="617" text-anchor="middle" font-size="10.5" fill="#1f2937">LUT C + LUT D → O7B</text>
  <line x1="325" y1="580" x2="325" y2="470" stroke="#374151" stroke-width="1.6"/>

  <!-- Row A -->
  <line x1="10" y1="205" x2="40" y2="205" stroke="#374151" stroke-width="1.6"/>
  <text x="14" y="197" font-size="12" fill="#1f2937">6</text>
  <rect x="40" y="160" width="110" height="90" rx="6" fill="#EAF1F6" stroke="#1A5276" stroke-width="2"/>
  <text x="95" y="209" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">LUT6 A</text>
  <line x1="150" y1="205" x2="180" y2="205" stroke="#374151" stroke-width="1.6"/>
  <line x1="230" y1="205" x2="430" y2="205" stroke="#374151" stroke-width="1.6"/>
  <circle cx="245" cy="205" r="3" fill="#374151"/>
  <path d="M 245 205 L 245 275 L 250 275" fill="none" stroke="#374151" stroke-width="1.6"/>
  <line x1="270" y1="205" x2="270" y2="162" stroke="#374151" stroke-width="1.6"/>
  <line x1="270" y1="162" x2="750" y2="162" stroke="#374151" stroke-width="1.6"/>
  <text x="756" y="166" font-size="11.5" fill="#1f2937">A (combinational)</text>
  <rect x="430" y="170" width="100" height="70" rx="6" fill="#EAF1F6" stroke="#1A5276" stroke-width="2"/>
  <text x="480" y="201" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">FF/Latch</text>
  <text x="480" y="218" text-anchor="middle" font-size="11" fill="#1f2937">(AFF)</text>
  <line x1="530" y1="205" x2="750" y2="205" stroke="#374151" stroke-width="1.6"/>
  <text x="756" y="209" font-size="11.5" fill="#1f2937">AQ (registered)</text>
  <text x="610" y="150" text-anchor="middle" font-size="11" fill="#5f6b7a">direct input (bypass)</text>
  <line x1="610" y1="155" x2="610" y2="168" stroke="#374151" stroke-width="1.6"/>
  <path d="M 604 160 L 610 170 L 616 160" fill="none" stroke="#374151" stroke-width="1.6"/>
  <rect x="560" y="170" width="100" height="70" rx="6" fill="#EAF1F6" stroke="#1A5276" stroke-width="2"/>
  <text x="610" y="201" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">FF only</text>
  <text x="610" y="218" text-anchor="middle" font-size="11" fill="#1f2937">(A2)</text>
  <line x1="660" y1="205" x2="660" y2="248" stroke="#374151" stroke-width="1.6"/>
  <line x1="660" y1="248" x2="750" y2="248" stroke="#374151" stroke-width="1.6"/>
  <text x="756" y="252" font-size="11.5" fill="#1f2937">AQ2 (bypass-reg.)</text>

