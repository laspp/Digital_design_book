<svg width="620" height="300" viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="620" height="300" fill="#ffffff"/>

  <!-- output path -->
  <text x="10" y="30" font-size="13.5" font-weight="600" fill="#1f2937">output path</text>
  <line x1="10" y1="55" x2="60" y2="55" stroke="#374151" stroke-width="1.8"/>
  <text x="12" y="47" font-size="13" fill="#1f2937">from FPGA fabric</text>

  <!-- bypass/register mux for output -->
  <line x1="60" y1="55" x2="60" y2="90" stroke="#374151" stroke-width="1.8"/>
  <line x1="60" y1="90" x2="95" y2="90" stroke="#374151" stroke-width="1.8"/>
  <rect x="95" y="65" width="55" height="50" rx="4" fill="#EAF1F6" stroke="#1A5276" stroke-width="2"/>
  <text x="108" y="96" font-size="15" fill="#1f2937">D</text>
  <text x="130" y="96" font-size="15" fill="#1f2937">Q</text>
  <line x1="118" y1="115" x2="118" y2="130" stroke="#374151" stroke-width="1.8"/>
  <path d="M 112 115 L 118 122 L 124 115" fill="none" stroke="#1A5276" stroke-width="1.6"/>

  <polygon points="150,50 190,65 190,115 150,130" fill="#EAF1F6" stroke="#1A5276" stroke-width="2"/>
  <line x1="60" y1="55" x2="150" y2="55" stroke="#374151" stroke-width="1.8"/>
  <line x1="150" y1="55" x2="150" y2="55" stroke="#374151" stroke-width="1.8"/>
  <line x1="150" y1="90" x2="150" y2="90" stroke="#374151" stroke-width="1.8"/>

  <!-- tri-state buffer -->
  <line x1="190" y1="90" x2="230" y2="90" stroke="#374151" stroke-width="1.8"/>
  <polygon points="230,68 280,90 230,112" fill="#EAF1F6" stroke="#1A5276" stroke-width="2"/>
  <line x1="255" y1="90" x2="255" y2="60" stroke="#C0392B" stroke-width="1.8"/>
  <text x="260" y="55" font-size="13" fill="#7a2a1c">OE</text>

  <line x1="280" y1="90" x2="340" y2="90" stroke="#374151" stroke-width="1.8"/>

  <!-- pad -->
  <rect x="340" y="65" width="70" height="50" rx="4" fill="#FCEEEA" stroke="#C0392B" stroke-width="1.8"/>
  <text x="375" y="95" text-anchor="middle" font-size="14" fill="#7a2a1c">I/O pad</text>

  <!-- input path -->
  <text x="10" y="180" font-size="13.5" font-weight="600" fill="#1f2937">input path</text>
  <line x1="410" y1="90" x2="450" y2="90" stroke="#374151" stroke-width="1.8"/>
  <line x1="450" y1="90" x2="450" y2="220" stroke="#374151" stroke-width="1.8"/>
  <line x1="450" y1="220" x2="410" y2="220" stroke="#374151" stroke-width="1.8"/>

  <rect x="330" y="195" width="80" height="50" rx="4" fill="#EAF1F6" stroke="#1A5276" stroke-width="2"/>
  <text x="345" y="226" font-size="15" fill="#1f2937">Q</text>
  <text x="385" y="226" font-size="15" fill="#1f2937">D</text>
  <line x1="368" y1="245" x2="368" y2="260" stroke="#374151" stroke-width="1.8"/>
  <path d="M 362 245 L 368 252 L 374 245" fill="none" stroke="#1A5276" stroke-width="1.6"/>

  <line x1="330" y1="220" x2="150" y2="220" stroke="#374151" stroke-width="1.8"/>
  <line x1="150" y1="220" x2="150" y2="160" stroke="#374151" stroke-width="1.8"/>
  <line x1="150" y1="160" x2="60" y2="160" stroke="#374151" stroke-width="1.8"/>
  <text x="12" y="150" font-size="13" fill="#1f2937">to FPGA fabric</text>

  <!-- shared clock -->
  <line x1="118" y1="130" x2="118" y2="270" stroke="#374151" stroke-width="1.8"/>
  <line x1="118" y1="270" x2="368" y2="270" stroke="#374151" stroke-width="1.8"/>
  <line x1="368" y1="270" x2="368" y2="260" stroke="#374151" stroke-width="1.8"/>
  <text x="10" y="285" font-size="13" fill="#1f2937">clk</text>

  <text x="255" y="20" text-anchor="middle" font-size="13" fill="#5f6b7a">registers and OE control are optional, configured per pin</text>
</svg>
