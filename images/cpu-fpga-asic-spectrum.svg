<svg width="640" height="340" viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs>
<linearGradient id="spectrumGrad" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#EAF1F6"/>
<stop offset="50%" stop-color="#D6C9DC"/>
<stop offset="100%" stop-color="#F5D6D0"/>
</linearGradient>
</defs>

<rect width="640" height="340" fill="#ffffff"/>

<rect x="30" y="40" width="160" height="90" rx="6" fill="#EAF1F6" stroke="#1A5276" stroke-width="2"/>
<text x="110" y="70" text-anchor="middle" fill="#1f2937" font-size="16" font-weight="600">CPU</text>
<text x="110" y="93" text-anchor="middle" fill="#1f2937" font-size="12">fixed hardware,</text>
<text x="110" y="111" text-anchor="middle" fill="#1f2937" font-size="12">flexible software</text>

<rect x="240" y="40" width="160" height="90" rx="6" fill="#EAF1F6" stroke="#1A5276" stroke-width="2"/>
<text x="320" y="70" text-anchor="middle" fill="#1f2937" font-size="16" font-weight="600">FPGA</text>
<text x="320" y="93" text-anchor="middle" fill="#1f2937" font-size="12">hardware itself</text>
<text x="320" y="111" text-anchor="middle" fill="#1f2937" font-size="12">is configuration</text>

<rect x="450" y="40" width="160" height="90" rx="6" fill="#EAF1F6" stroke="#1A5276" stroke-width="2"/>
<text x="530" y="70" text-anchor="middle" fill="#1f2937" font-size="16" font-weight="600">ASIC</text>
<text x="530" y="93" text-anchor="middle" fill="#1f2937" font-size="12">fixed hardware,</text>
<text x="530" y="111" text-anchor="middle" fill="#1f2937" font-size="12">fixed behavior</text>

<line x1="110" y1="130" x2="110" y2="250" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="320" y1="130" x2="320" y2="250" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="530" y1="130" x2="530" y2="250" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>

<rect x="60" y="250" width="520" height="24" rx="12" fill="url(#spectrumGrad)" stroke="#1A5276" stroke-width="2"/>

<circle cx="110" cy="262" r="5" fill="#C0392B" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="320" cy="262" r="5" fill="#C0392B" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="530" cy="262" r="5" fill="#C0392B" stroke="#ffffff" stroke-width="1.5"/>

<text x="60" y="300" text-anchor="start" fill="#1f2937" font-size="13" font-weight="600">general-purpose,</text>
<text x="60" y="318" text-anchor="start" fill="#1f2937" font-size="13" font-weight="600">reprogrammable</text>

<text x="320" y="300" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="600">reconfigurable</text>
<text x="320" y="318" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="600">middle ground</text>

<text x="580" y="300" text-anchor="end" fill="#1f2937" font-size="13" font-weight="600">application-specific,</text>
<text x="580" y="318" text-anchor="end" fill="#1f2937" font-size="13" font-weight="600">fixed at fabrication</text>
</svg>
